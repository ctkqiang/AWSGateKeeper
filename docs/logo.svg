<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="200" rx="12" fill="url(#shield)" />

  <!-- Shield icon -->
  <g transform="translate(35, 30)">
    <path d="M60 10 L110 30 L110 80 Q110 115 60 130 Q10 115 10 80 L10 30 Z"
          fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <path d="M60 35 L85 48 L85 75 Q85 98 60 108 Q35 98 35 75 L35 48 Z"
          fill="url(#accent)" opacity="0.15" />
    <text x="60" y="95" text-anchor="middle" font-family="monospace" font-size="28" font-weight="900" fill="url(#accent)" filter="url(#glow)">GK</text>
  </g>

  <!-- Title -->
  <text x="170" y="68" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    AWSGateKeeper
  </text>

  <!-- Accent line -->
  <rect x="170" y="82" width="100" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Subtitle -->
  <text x="170" y="108" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8892B0" letter-spacing="1.5">
    AWS IAM SECURITY AUDIT GATEWAY
  </text>

  <!-- Tags -->
  <g transform="translate(170, 128)">
    <rect x="0" y="0" width="72" height="20" rx="10" fill="#00D2FF" opacity="0.15" />
    <text x="36" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#00D2FF">GuardDuty</text>

    <rect x="80" y="0" width="60" height="20" rx="10" fill="#7B2FF7" opacity="0.15" />
    <text x="110" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#7B2FF7">Inspector</text>

    <rect x="148" y="0" width="62" height="20" rx="10" fill="#FF6B6B" opacity="0.15" />
    <text x="179" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#FF6B6B">Detective</text>

    <rect x="218" y="0" width="42" height="20" rx="10" fill="#FFD93D" opacity="0.15" />
    <text x="239" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFD93D">SIEM</text>
  </g>

  <!-- AWS references -->
  <g transform="translate(170, 162)">
    <text font-family="monospace" font-size="9" fill="#495670">
      GuardDuty · Inspector · Detective · IAM · CloudTrail · Cognito · S3 · STS
    </text>
  </g>
</svg>
