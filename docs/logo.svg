<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="720" height="200" rx="0" fill="url(#bg)"/>

  <!-- Geometric Shield Icon -->
  <g transform="translate(48, 36)">
    <!-- Outer hexagon -->
    <polygon points="64,4 124,24 124,94 64,124 4,94 4,24" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Middle shield -->
    <polygon points="64,16 112,32 112,88 64,112 16,88 16,32" fill="#1E293B" stroke="url(#iconGrad)" stroke-width="2"/>
    <!-- Inner gate bars -->
    <rect x="52" y="42" width="24" height="4" rx="2" fill="url(#iconGrad)" opacity="0.9"/>
    <rect x="52" y="52" width="24" height="4" rx="2" fill="url(#iconGrad)" opacity="0.7"/>
    <rect x="52" y="62" width="24" height="4" rx="2" fill="url(#iconGrad)" opacity="0.5"/>
    <rect x="52" y="72" width="24" height="4" rx="2" fill="url(#iconGrad)" opacity="0.3"/>
    <!-- Checkmark on gate -->
    <path d="M76 56 L82 64 L96 48" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divider line -->
  <line x1="188" y1="48" x2="188" y2="152" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="216" y="76" font-family="SF Pro Display,-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#F1F5F9" letter-spacing="-0.5">
    AWS<tspan fill="url(#iconGrad)">GateKeeper</tspan>
  </text>

  <!-- Subtitle -->
  <text x="216" y="104" font-family="SF Pro Display,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="2">
    IAM SECURITY AUDIT GATEWAY
  </text>

  <!-- Feature badges -->
  <g transform="translate(216, 122)">
    <rect x="0" y="0" width="78" height="22" rx="11" fill="#FF9900" opacity="0.12"/>
    <text x="39" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#FF9900">GuardDuty</text>

    <rect x="86" y="0" width="66" height="22" rx="11" fill="#8B5CF6" opacity="0.12"/>
    <text x="119" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#8B5CF6">Inspector</text>

    <rect x="160" y="0" width="70" height="22" rx="11" fill="#EF4444" opacity="0.12"/>
    <text x="195" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#EF4444">Detective</text>

    <rect x="238" y="0" width="44" height="22" rx="11" fill="#22C55E" opacity="0.12"/>
    <text x="260" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#22C55E">SIEM</text>

    <rect x="290" y="0" width="56" height="22" rx="11" fill="#3B82F6" opacity="0.12"/>
    <text x="318" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#3B82F6">IAM</text>
  </g>

  <!-- Footer line -->
  <rect x="216" y="156" width="460" height="1" fill="#334155"/>
</svg>
